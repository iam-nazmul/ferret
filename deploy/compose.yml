# Local dev: run dependencies in containers, app processes on the host (reload works).
#   docker compose -f deploy/compose.yml up -d postgres redis reranker
name: ferret

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ferret
      POSTGRES_PASSWORD: ferret
      POSTGRES_DB: ferret
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferret"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  reranker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.reranker
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8081/healthz')"]
      interval: 15s
      start_period: 60s
      retries: 10

  # Optional: the full stack in containers. `docker compose --profile full up`
  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://ferret:ferret@postgres:5432/ferret
      REDIS_URL: redis://redis:6379/0
      RERANKER_URL: http://reranker:8081
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    command: celery -A app.ingest.worker worker -l info -Q celery,ocr
    env_file: [../.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://ferret:ferret@postgres:5432/ferret
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    # Exactly one replica, always. Duplicate schedulers double-crawl every source.
    command: celery -A app.ingest.worker beat -l info
    env_file: [../.env]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}

  ui:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ui
    environment:
      API_BASE_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  pgdata:
