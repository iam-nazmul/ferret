apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferret-reranker
spec:
  replicas: 1
  selector: {matchLabels: {app: ferret-reranker}}
  template:
    metadata:
      labels: {app: ferret-reranker}
    spec:
      containers:
        - name: reranker
          image: ferret/reranker:latest
          ports: [{containerPort: 8081}]
          resources:
            requests: {cpu: "1", memory: "4Gi"}
            limits: {cpu: "4", memory: "8Gi"}
          readinessProbe:
            httpGet: {path: /healthz, port: 8081}
            # Cold start is ~30s while the model loads.
            initialDelaySeconds: 40
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ferret-reranker
spec:
  selector: {app: ferret-reranker}
  ports: [{port: 8081, targetPort: 8081}]
