apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferret-ui
spec:
  replicas: 2
  selector: {matchLabels: {app: ferret-ui}}
  template:
    metadata:
      labels: {app: ferret-ui}
    spec:
      containers:
        - name: ui
          image: ferret/ui:latest
          ports: [{containerPort: 8501}]
          env:
            - {name: API_BASE_URL, value: "http://ferret-api"}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
---
apiVersion: v1
kind: Service
metadata:
  name: ferret-ui
spec:
  selector: {app: ferret-ui}
  ports: [{port: 80, targetPort: 8501}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ferret
  annotations:
    # SSE needs a long read timeout and no buffering, or answers arrive all at once.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
    - host: ferret.internal
      http:
        paths:
          - {path: /v1, pathType: Prefix, backend: {service: {name: ferret-api, port: {number: 80}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: ferret-ui, port: {number: 80}}}}
