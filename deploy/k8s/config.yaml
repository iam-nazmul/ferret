apiVersion: v1
kind: ConfigMap
metadata:
  name: ferret-config
data:
  RERANKER_URL: "http://ferret-reranker:8081"
  LANGSMITH_PROJECT: "ferret"
  LANGSMITH_TRACING: "true"
  OIDC_GROUP_CLAIM: "groups"
  OIDC_ADMIN_GROUP: "ferret-admins"
  AUTH_DISABLED: "false"
---
# Secrets come from the cluster secret store — never from a manifest or an image.
# Required keys: ANTHROPIC_API_KEY, OPENAI_API_KEY, LANGSMITH_API_KEY,
#                DATABASE_URL, REDIS_URL, OIDC_ISSUER, OIDC_AUDIENCE
apiVersion: v1
kind: Secret
metadata:
  name: ferret-secrets
type: Opaque
stringData: {}
