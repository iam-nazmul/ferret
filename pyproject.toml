[project]
name = "ferret"
version = "0.1.0"
description = "Enterprise document assistant — RAG with citations, memory, and evaluation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.7",
    "langchain>=0.3.9",
    "langchain-core>=0.3.25",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langsmith>=0.2.0",
    "anthropic>=0.40",
    "openai>=1.57",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.28",
    "pymupdf>=1.25",
    "trafilatura>=2.0",
    "lxml>=5.3",
    "tiktoken>=0.8",
    "pyjwt[crypto]>=2.10",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "tenacity>=9.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.41", "httpx-sse>=0.4"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
